<svg width="1200" height="860" viewBox="0 0 1200 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="860" fill="#0B1220"/>
  <text x="80" y="92" fill="#F8FAFC" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="800">How Search-First Storage Works</text>
  <text x="80" y="132" fill="#94A3B8" font-size="22" font-family="Arial, Helvetica, sans-serif">Three steps. No elaborate pre-organization required.</text>

  <rect x="80" y="190" width="300" height="540" rx="28" fill="#111827" stroke="#334155"/>
  <rect x="450" y="190" width="300" height="540" rx="28" fill="#111827" stroke="#334155"/>
  <rect x="820" y="190" width="300" height="540" rx="28" fill="#111827" stroke="#334155"/>

  <circle cx="128" cy="240" r="28" fill="#FCD900"/>
  <text x="119" y="250" fill="#0F172A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="800">1</text>
  <circle cx="498" cy="240" r="28" fill="#FCD900"/>
  <text x="489" y="250" fill="#0F172A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="800">2</text>
  <circle cx="868" cy="240" r="28" fill="#FCD900"/>
  <text x="859" y="250" fill="#0F172A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="800">3</text>

  <text x="168" y="250" fill="#F8FAFC" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">Label the box</text>
  <text x="538" y="250" fill="#F8FAFC" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">Log the contents</text>
  <text x="908" y="250" fill="#F8FAFC" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="800">Search or scan later</text>

  <g transform="translate(120 320)">
    <rect x="0" y="80" width="220" height="136" rx="16" fill="#8B5E34"/>
    <rect x="0" y="80" width="220" height="20" rx="10" fill="#A26D3E"/>
    <rect x="22" y="120" width="72" height="72" rx="10" fill="#F8FAFC"/>
    <rect x="32" y="130" width="16" height="16" fill="#0F172A"/>
    <rect x="52" y="130" width="10" height="32" fill="#0F172A"/>
    <rect x="66" y="130" width="18" height="8" fill="#0F172A"/>
    <rect x="66" y="142" width="18" height="20" fill="#0F172A"/>
    <rect x="32" y="166" width="12" height="12" fill="#0F172A"/>
    <rect x="48" y="170" width="36" height="8" fill="#0F172A"/>
    <text x="114" y="168" fill="#F8FAFC" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="800">B-021</text>
  </g>
  <text x="118" y="604" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">Add a QR code and a readable ID so the</text>
  <text x="118" y="638" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">container is easy to find in real life.</text>

  <g transform="translate(494 320)">
    <rect x="0" y="0" width="212" height="248" rx="24" fill="#0F172A" stroke="#334155"/>
    <rect x="18" y="20" width="176" height="32" rx="10" fill="#1E293B"/>
    <text x="30" y="42" fill="#F8FAFC" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">StashDog</text>
    <text x="30" y="86" fill="#FCD900" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="800">Box B-021</text>
    <text x="30" y="126" fill="#E2E8F0" font-size="18" font-family="Arial, Helvetica, sans-serif">- Gift wrap</text>
    <text x="30" y="156" fill="#E2E8F0" font-size="18" font-family="Arial, Helvetica, sans-serif">- Ribbon</text>
    <text x="30" y="186" fill="#E2E8F0" font-size="18" font-family="Arial, Helvetica, sans-serif">- Tissue paper</text>
    <text x="30" y="216" fill="#E2E8F0" font-size="18" font-family="Arial, Helvetica, sans-serif">- Tape</text>
  </g>
  <text x="488" y="604" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">Create the box record once, then let the</text>
  <text x="488" y="638" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">app remember the contents for you.</text>

  <g transform="translate(860 308)">
    <circle cx="110" cy="108" r="82" fill="#0F172A" stroke="#FCD900" stroke-width="12"/>
    <line x1="166" y1="164" x2="230" y2="228" stroke="#FCD900" stroke-width="18" stroke-linecap="round"/>
    <text x="68" y="102" fill="#F8FAFC" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">Find:</text>
    <text x="36" y="134" fill="#F8FAFC" font-size="20" font-family="Arial, Helvetica, sans-serif">passport photos</text>
    <text x="54" y="186" fill="#86EFAC" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="800">B-021</text>
  </g>
  <text x="856" y="604" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">Search for the item or scan the label and</text>
  <text x="856" y="638" fill="#CBD5E1" font-size="24" font-family="Arial, Helvetica, sans-serif">skip the “open six boxes” routine.</text>

  <line x1="390" y1="458" x2="442" y2="458" stroke="#475569" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="760" y1="458" x2="812" y2="458" stroke="#475569" stroke-width="4" stroke-dasharray="10 10"/>
</svg>